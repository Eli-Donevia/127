<!doctype html>
<!-- Studio's animated card for HyperFrames (lib/motion.js fills __W__, __H__, __SECONDS__ and the data). -->
<!-- An end card or a title card in the member's colors. Motion is WAAPI only, so nothing loads from the web. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<style>
  @font-face { font-family: 'Geist'; font-weight: 500; src: url('Geist-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 600; src: url('Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('Geist-Bold.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: __W__px; height: __H__px; overflow: hidden; background: var(--deep); }
  #root { position: relative; width: __W__px; height: __H__px; overflow: hidden; font-family: 'Geist', sans-serif; color: var(--text); }
  #bg { position: absolute; inset: -20%; background: radial-gradient(60% 45% at 50% 42%, var(--glow) 0%, transparent 70%), linear-gradient(135deg, var(--mid), var(--deep) 70%); opacity: .9; }
  #grain { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px); }
  #stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 34px); padding: 0 calc(var(--u) * 80px); text-align: center; }
  #logo { width: calc(var(--u) * 200px); height: calc(var(--u) * 200px); object-fit: contain; border-radius: calc(var(--u) * 28px); }
  #name { position: relative; font-weight: 700; font-size: var(--nameSize); line-height: 1.02; letter-spacing: -0.035em; }
  #name .w { display: inline-block; white-space: nowrap; }
  #name .c { display: inline-block; }
  #rule { height: calc(var(--u) * 10px); width: calc(var(--u) * 420px); border-radius: 99px; background: linear-gradient(90deg, var(--pop), var(--box)); transform-origin: 50% 50%; box-shadow: 0 0 calc(var(--u) * 18px) color-mix(in srgb, var(--pop) 45%, transparent); }
  #line { font-weight: 500; font-size: calc(var(--u) * 50px); line-height: 1.25; opacity: .92; max-width: calc(var(--u) * 900px); }
  #cta { font-weight: 600; font-size: calc(var(--u) * 44px); padding: calc(var(--u) * 22px) calc(var(--u) * 52px); border-radius: 999px; background: var(--box); color: var(--onBox); }
  #tag { position: absolute; right: calc(var(--u) * 36px); top: calc(var(--u) * 36px); font: 600 calc(var(--u) * 26px) 'Geist'; padding: calc(var(--u) * 8px) calc(var(--u) * 18px); border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; letter-spacing: .08em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root" data-no-timeline data-composition-id="main" data-start="0" data-duration="__SECONDS__" data-width="__W__" data-height="__H__">
  <div id="bg"></div>
  <div id="grain"></div>
  <div id="stack">
    <img id="logo" src="logo.png" alt="" hidden />
    <h1 id="name"></h1>
    <div id="rule"></div>
    <p id="line" hidden></p>
    <p id="cta" hidden></p>
  </div>
  <div id="tag" hidden>SAMPLE</div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
  const D = JSON.parse(document.getElementById('data').textContent);
  const root = document.documentElement;
  const u = Math.min(__W__, __H__) / 1080;
  root.style.setProperty('--u', u);
  for (const [k, v] of Object.entries(D.look || {})) root.style.setProperty('--' + k, v);
  const name = String(D.name || '');
  const len = name.length;
  root.style.setProperty('--nameSize', Math.round(u * (len > 28 ? 84 : len > 18 ? 104 : 128)) + 'px');
  const nameEl = document.getElementById('name');
  const chars = [];
  for (const word of name.split(/\s+/).filter(Boolean)) {
    const w = document.createElement('span');
    w.className = 'w';
    for (const ch of word) { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; w.appendChild(c); chars.push(c); }
    nameEl.appendChild(w);
    nameEl.appendChild(document.createTextNode(' '));
  }
  const show = (id, text) => { const el = document.getElementById(id); if (text) { el.textContent = text; el.hidden = false; } return el; };
  const line = show('line', D.line);
  const cta = show('cta', D.cta);
  const logo = document.getElementById('logo');
  if (D.logo) logo.hidden = false;
  if (D.sample) document.getElementById('tag').hidden = false;

  // The beat: background breathes, letters rise in a stagger, the rule draws, a glint in the accent
  // color runs through the letters once (each one solid, no gradient text), then the line and the
  // button settle. A title card holds the name and leaves the rest.
  const ease = 'cubic-bezier(.16,1,.3,1)';
  const spring = 'cubic-bezier(.34,1.56,.64,1)';
  const total = __SECONDS__ * 1000;
  const A = [];
  const at = (el, frames, opts) => { if (el) A.push(el.animate(frames, { fill: 'both', ...opts })); };
  at(document.getElementById('bg'), [{ transform: 'scale(1.08) rotate(-2deg)' }, { transform: 'scale(1) rotate(0deg)' }], { duration: total, easing: 'ease-out' });
  if (D.logo) at(logo, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 650, delay: 80, easing: spring });
  const step = Math.max(18, Math.min(45, 700 / Math.max(1, chars.length)));
  chars.forEach((c, i) => at(c, [{ opacity: 0, transform: 'translateY(.55em) rotate(4deg)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 620, delay: 200 + i * step, easing: ease }));
  const after = 200 + chars.length * step + 250;
  at(document.getElementById('rule'), [{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'scaleX(1)', opacity: 1 }], { duration: 700, delay: after - 150, easing: ease });
  const glint = Math.max(14, Math.min(40, 650 / Math.max(1, chars.length)));
  chars.forEach((c, i) => A.push(c.animate([{ color: 'var(--text)' }, { color: 'var(--pop)', offset: 0.4 }, { color: 'var(--text)' }], { duration: 420, delay: after + i * glint, easing: 'ease-in-out', fill: 'none' })));
  at(line, [{ opacity: 0, transform: 'translateY(24px)' }, { opacity: .92, transform: 'none' }], { duration: 600, delay: after + 250, easing: ease });
  at(cta, [{ opacity: 0, transform: 'scale(.82)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 650, delay: after + 500, easing: spring });
  if (D.kind === 'title') at(document.getElementById('stack'), [{ opacity: 1 }, { opacity: 0 }], { duration: 400, delay: Math.max(0, total - 400) });
  A.forEach((a) => a.pause());
</script>
</body>
</html>
