<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach dashboard</title>
<style>
@font-face{font-family:Geist;src:url(/fonts/Geist-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Geist;src:url(/fonts/Geist-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Geist;src:url(/fonts/Geist-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
/* Coach dashboard: the challenge at a glance, then who to message today, then the board. Phone first.
   Sample clients until client accounts land (they are labeled as samples on the page). */
:root{--bg:#0b0b0d;--card:#141418;--card-2:#1b1b20;--ink:#ededf2;--ink-2:#b3b3bd;--muted:#8b8b96;--line:rgba(255,255,255,.09);
  --coach:#C83A75;--ok:#3ee6a0;--late:#f2b45c;--miss:#f09b8a;--font:Geist,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:24px;letter-spacing:-.03em;margin:2px 0 4px;line-height:1.1}
h2{font-size:15px;margin:22px 0 8px;letter-spacing:-.01em}
.sample{display:inline-block;font-size:12px;color:var(--late);border:1px solid rgba(242,180,92,.4);border-radius:999px;padding:2px 9px;margin-top:6px}
.bar{height:6px;border-radius:9px;background:var(--card-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--coach)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--card-2)}
.grow{flex:1;min-width:0}
.nm{font-weight:600}
.sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--card-2)}
.dots i.y{background:var(--ok)}
.dots i.n{background:rgba(240,155,138,.55)}
.pill{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.pill.ok{color:var(--ok);background:rgba(62,230,160,.1)}
.pill.late{color:var(--late);background:rgba(242,180,92,.1)}
.pill.miss{color:var(--miss);background:rgba(240,155,138,.1)}
.msg{background:var(--card-2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;color:var(--ink)}
button.copy{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
button.copy:focus-visible{outline:2px solid var(--coach);outline-offset:2px}
.rank{flex:none;width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="biz">Reyes Strength</div>
  <h1 id="ch">The 21-Day Strength Challenge</h1>
  <div class="sub" id="day">Day 7 of 21</div>
  <span class="sample">Sample clients</span>
  <div class="bar"><i id="prog" style="width:33%"></i></div>
  <div class="stats">
    <div class="stat"><b id="sJoined">0</b><span>joined</span></div>
    <div class="stat"><b id="sToday">0</b><span>checked in today</span></div>
    <div class="stat"><b id="sMiss">0</b><span>missed 2+ days</span></div>
  </div>

  <h2>Message today</h2>
  <div class="list" id="nudge"></div>

  <h2>The board</h2>
  <div class="list" id="board"></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var color = /^#[0-9a-f]{6}$/i.test(q.get('color')||'') ? q.get('color') : '#C83A75';
  document.documentElement.style.setProperty('--coach', color);
  var days = Math.max(7, Math.min(90, parseInt(q.get('days')||'21',10)||21)), today = 7;
  document.getElementById('biz').textContent = q.get('coach') || 'Reyes Strength';
  document.getElementById('ch').textContent = q.get('ch') || 'The 21-Day Strength Challenge';
  document.getElementById('day').textContent = 'Day ' + today + ' of ' + days;
  document.getElementById('prog').style.width = Math.round(today/days*100) + '%';
  var first = (q.get('by')||'Jordan').split(' ')[0];
  // Made-up clients: a check-in pattern per person for days 1..7 (1 = checked in).
  var C = [
    ['Ana M.','1111111'],['Chris T.','1111110'],['Dee W.','1101111'],['Maya L.','1111111'],['Sam R.','1110000'],
    ['Jo P.','1111101'],['Luis G.','1111111'],['Priya K.','1100100'],['Rob S.','0111111'],['Tess N.','1111100'],
    ['Will A.','1000000'],['Zoe H.','1111111']
  ].map(function(c){ var p=c[1].split('').map(Number); var miss=0; for(var i=p.length-1;i>=0&&!p[i];i--) miss++; return {n:c[0], p:p, pts:p.reduce(function(a,b){return a+b;},0), miss:miss}; });
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ini(n){ return n.split(' ').map(function(w){return w[0];}).join(''); }
  function dots(p){ var h=''; for(var i=0;i<days&&i<14;i++) h+='<i class="'+(i<p.length?(p[i]?'y':'n'):'')+'"></i>'; return '<div class="dots">'+h+'</div>'; }
  document.getElementById('sJoined').textContent = C.length;
  document.getElementById('sToday').textContent = C.filter(function(c){return c.p[today-1];}).length;
  document.getElementById('sMiss').textContent = C.filter(function(c){return c.miss>=2;}).length;
  var who = C.filter(function(c){ return c.miss>=1; }).sort(function(a,b){ return b.miss-a.miss; });
  document.getElementById('nudge').innerHTML = who.map(function(c){
    var f = c.n.split(' ')[0];
    var text = c.miss>=3 ? 'Hey '+f+', it\'s '+first+'. No pressure, just checking in. Want a 15-minute version of today\'s workout to get back in?'
      : c.miss===2 ? 'Hey '+f+', missed you the last two days. Today\'s workout is a short one. You in?'
      : f+', quick one: did you get today\'s workout in? Tick it in the app before bed.';
    var tag = c.miss>=3 ? 'miss' : c.miss===2 ? 'late' : 'ok';
    return '<div class="row" style="display:block"><div style="display:flex;gap:10px;align-items:center"><div class="av">'+esc(ini(c.n))+'</div><div class="grow"><div class="nm">'+esc(c.n)+'</div>'+dots(c.p)+'</div><span class="pill '+tag+'">'+(c.miss===1?'not yet today':c.miss+' days')+'</span></div>'+
      '<div class="msg">'+esc(text)+'</div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="copy" data-copy="'+esc(text)+'">Copy message</button></div></div>';
  }).join('') || '<div class="row">Everyone checked in today.</div>';
  var board = C.slice().sort(function(a,b){ return b.pts-a.pts || a.n.localeCompare(b.n); });
  document.getElementById('board').innerHTML = board.map(function(c,i){
    return '<div class="row"><span class="rank">'+(i+1)+'</span><div class="av">'+esc(ini(c.n))+'</div><div class="grow"><div class="nm">'+esc(c.n)+'</div>'+dots(c.p)+'</div><span class="pts">'+c.pts+'</span></div>';
  }).join('');
  document.addEventListener('click', function(e){ var b=e.target.closest('[data-copy]'); if(!b) return; var t=b.getAttribute('data-copy');
    try { navigator.clipboard.writeText(t).then(function(){ b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy'; },1200); }, function(){ b.textContent='Select it'; }); } catch(_) { b.textContent='Select it'; } });
})();
</script>
</body>
</html>
