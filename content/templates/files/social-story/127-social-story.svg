<text x="96" y="530" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="5">[NOW BOOKING]</text>
<text x="96" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="400" fill="#151515" text-anchor="start" letter-spacing="-2">[Your news</text>
<text x="96" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="400" fill="#151515" text-anchor="start" letter-spacing="-2">in a few</text>
