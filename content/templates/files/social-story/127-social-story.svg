<text x="96" y="1080" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#45453F" text-anchor="start">[One or two lines on what it is</text>
<text x="96" y="1140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#45453F" text-anchor="start">and who it’s for.]</text>
