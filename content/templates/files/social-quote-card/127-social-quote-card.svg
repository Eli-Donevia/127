<text x="96" y="1022" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#151515" text-anchor="start" letter-spacing="0.2">[Your business]</text>
<text x="984" y="1022" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#86857E" text-anchor="end">[@yourhandle]</text>
</svg>
