<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Customer quote card</title>
<rect width="1080" height="1080" fill="#F6F5F1"/>
<text x="80" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="400" fill="#111111" text-anchor="start">“</text>
<text x="96" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#151515" text-anchor="start" letter-spacing="-1">Add a real review</text>
<text x="96" y="528" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#151515" text-anchor="start" letter-spacing="-1">you have permission</text>
<text x="96" y="616" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#151515" text-anchor="start" letter-spacing="-1">to use.</text>
<rect x="96" y="744" width="72" height="6" fill="#111111"/>
<text x="96" y="816" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#151515" text-anchor="start">[Customer first name]</text>
<text x="96" y="862" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#86857E" text-anchor="start">[What you did for them]</text>
